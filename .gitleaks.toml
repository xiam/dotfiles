title = "Dotfiles secret scanning"

# Retain every rule and built-in exception from native Gitleaks 8.18.4.
[extend]
useDefault = true

# Exact public evidence matches only; do not exclude files or hash-shaped values.
# Native 8.18.4 cannot merge rule-local exceptions into extended rules.
[allowlist]
description = "Reviewed immutable public digests and signing-key fingerprints"
regexTarget = "match"
regexes = [
    # Public SHA256 integrity evidence: scripts/app_provenance.py.
    '''^authorization": "266bf371022fa5461a1138186e83cfacfd8c74de663f67c10a5486e58d252575"$''',
    # Public SHA256 integrity evidence: security/renewal-policy.json.
    '''^authorization_sha256": "266bf371022fa5461a1138186e83cfacfd8c74de663f67c10a5486e58d252575"$''',
    # Public node-readdirp package SHA256; token-shaped prefix: security/debian-13-amd64.lock.tsv.
    '''^eaac13e138b03e3f342e14bb18c7febd2514a4feb4923f00669503aab7886541\t$''',
    # Public node-readdirp package SHA256; token-shaped prefix: security/debian-13-amd64-candidate.json.
    '''^eaac13e138b03e3f342e14bb18c7febd2514a4feb4923f00669503aab7886541"$''',
    # Public Debian archive signing-key fingerprint: scripts/refresh_native_lock.py.
    '''^key-12': 'B8B80B5B623EAB6AD8775C45B7C5D7D6350947F8'$''',
    # Public Debian archive signing-key fingerprint: scripts/refresh_native_lock.py.
    '''^key-12-security': '05AB90340C0C5E797F44A8C8254CF3B5AEC0A8F0'$''',
    # Public Debian archive signing-key fingerprint: scripts/refresh_native_lock.py.
    '''^key-13': '04B54C3CDCA79751B16BC6B5225629DF75B188BD'$''',
    # Public Debian archive signing-key fingerprint: scripts/refresh_native_lock.py.
    '''^key-13-security': '5E04A1E3223A19A20706E20F9904613D4CCE68C6'$''',
    # Public SHA256 integrity evidence: security/provenance/github/neoformat/admission.json.
    '''^key\.json": "f78f14c645dbc6753aaa0d32e0868ab54faddcbe3b0519f9e7cc001ec360b4ea"$''',
    # Public SHA256 integrity evidence: security/provenance/github/neoformat/policy.json.
    '''^key_sha256": "6e8af687f60cf3f403151c8fb1b26e95e6f9e424ca60cc8f3787bd4466a3ef84"$''',
    # Public SHA256 integrity evidence: security/macos-tahoe-arm64.json.
    '''^key_sha256": "ef2d2c9e0219d485df9f07fff7b037feadc36c93085be9ffefb1390f31a3de1d"$''',
